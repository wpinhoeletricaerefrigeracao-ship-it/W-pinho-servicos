name: Gerar APK W.Pinho Servicos

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'android_ready/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Capacitor
        working-directory: android_ready
        run: npm install

      - name: Criar projeto Android
        working-directory: android_ready
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Gerar APK
        working-directory: android_ready/android
        run: ./gradlew assembleDebug

      - name: Renomear APK
        run: cp android_ready/android/app/build/outputs/apk/debug/app-debug.apk W_Pinho_Servicos.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: W_Pinho_Servicos_APK
          path: W_Pinho_Servicos.apk
          retention-days: 30
